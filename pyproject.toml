[project]

name = "strwythura"
version = "2.0.0"

description = "Construct a knowledge graph from unstructured data sources, organized by results from entity resolution, implementing an enhanced GraphRAG approach, and also implementing an ontology pipeline, plus context engineering for optimizing AI application outcomes within a specific domain."

authors = [
    { name = "Paco Nathan", email = "paco@senzing.com" },
]

readme = "README.md"
license = { text = "MIT" }

requires-python = ">=3.11,<3.12"

dependencies = [
    # entity resolution
    "senzing-grpc (==0.5.11)",
    "sz-semantics (>=1.2.0,<2.0.0)",

    # location/geospatial
    "placekey (>=0.0.36,<0.0.37)",

    # web page crawling, text acquisition
    "requests (>=2.32.4,<3.0.0)",
    "requests-cache (>=1.2.1,<2.0.0)",
    "w3lib (>=2.3.1,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "lxml (>=6.0.0,<7.0.0)",
    "nltk (>=3.9.1,<4.0.0)",

    # NLP parsing, NER
    "spacy (>=3.8.7,<4.0.0)",
    "gliner (>=0.2.21,<0.3.0)",
    "gliner-spacy (>=0.0.11,<0.0.12)",
    "accelerate (>=1.10.1,<2.0.0)",
    "transformers (<4.57.0)",
    "datasets (>=4.0.0,<5.0.0)",
    "datasketch (>=1.8.0,<2.0.0)",

    # embedding, vector store
    "arrowspace (>=0.13.3,<0.14.0)",
    "numpy (>=1.17,<3.0.0)",
    "gensim (>=4.3.3,<5.0.0)",
    "lancedb (>=0.26)",
    "lance-namespace (==0.0.20)",
    "polars (>=1.32.3,<2.0.0)",

    # graph representation/validation
    "rdflib (>=7.4.0,<8.0.0)",
    "pyshacl (>=0.30.1,<0.31.0)",
    "validators (>=0.35.0,<0.36.0)",
    "networkx (>=3.5,<4.0)",

    # graph visualization
    "pyvis (>=0.3.2,<0.4.0)",

    # context engineering
    "dspy (>=3.0.4,<4.0.0)",

    # observability
    "opik (>=1.9.33,<2.0.0)",
    "pyinstrument (>=5.0.3,<6.0.0)",
    "icecream (>=2.1.8,<3.0.0)",
]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]

keywords = [
    "context engineering",
    "entity linking",
    "entity embedding",
    "entity resolution",
    "graph algorithms",
    "graphrag",
    "interactive visualization",
    "knowledge graph",
    "llm",
    "named entity recognition",
    "nlp",
    "ontology",
    "ontology pipeline",
    "relation extraction",
    "semantic expansion",
    "semantic layer",
    "semantic random walk",
    "spectral indexing",
    "textgraphs",
    "unstructured data",
    "vector database",
]


[project.urls]

homepage = "https://github.com/DerwenAI/strwythura"
doi = "https://doi.org/10.5281/zenodo.16934079"
slides = "https://derwen.ai/s/2njz#1"
video = "https://senzing.com/gph-graph-rag-llm-knowledge-graphs/"
article = "https://pacoid.medium.com/strwythura-2a8007af3682"


[tool.poetry.group.dev.dependencies]

pylint = "^3.3.7"
mypy = "^1.17.1"
types-requests = "^2.32.4.20250611"
pandas-stubs = "^2.3.0.250703"
types-networkx = "^3.5.0.20250728"


[tool.pylint.main]

ignore-paths = [
    "archive",
]


[build-system]

requires = [
    "poetry-core>=2.0.0,<3.0.0"
]

build-backend = "poetry.core.masonry.api"
